<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Saad Farhan — Open Graph Image</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; margin: 0; }
      body {
        display: grid;
        place-items: center;
        color: #202a24;
        background: #f5f4ef;
        font-family: "DM Sans", "Arial", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      main {
        position: relative;
        width: 1120px;
        height: 550px;
        overflow: hidden;
        padding: 55px 66px;
        border: 1px solid #daddd5;
      }
      .top, .bottom { display: flex; align-items: center; justify-content: space-between; }
      .top { color: #58645b; font: 14px "DM Mono", monospace; letter-spacing: .04em; text-transform: uppercase; }
      .mark { display: grid; width: 38px; height: 38px; place-items: center; border: 1px solid #b8c4b6; border-radius: 50%; color: #315f49; font: 600 14px Arial, sans-serif; letter-spacing: -.04em; }
      h1 { margin: 74px 0 12px; font-size: 82px; font-weight: 600; letter-spacing: -.075em; line-height: 1; }
      .role { margin: 0; color: #58645b; font-size: 27px; line-height: 1.4; }
      .rule { width: 100%; height: 1px; margin-top: 48px; background: #daddd5; }
      .bottom { position: absolute; right: 66px; bottom: 47px; left: 66px; color: #58645b; font: 14px "DM Mono", monospace; }
      .projects { display: flex; gap: 10px; }
      .projects span { padding: 9px 12px; border: 1px solid #daddd5; border-radius: 3px; color: #46534a; }
      .email { color: #315f49; }
      .accent { position: absolute; top: 0; right: 0; width: 9px; height: 100%; background: #315f49; }
    </style>
  </head>
  <body>
    <main>
      <div class="top"><span>Software developer</span><span class="mark">SF</span></div>
      <h1>Saad Farhan</h1>
      <p class="role">Web and desktop applications</p>
      <div class="rule"></div>
      <div class="bottom">
        <div class="projects"><span>Accounting</span><span>Roofing</span><span>Delivery</span></div>
        <span class="email">saadfarhan023@gmail.com</span>
      </div>
      <div class="accent"></div>
    </main>
  </body>
</html>
